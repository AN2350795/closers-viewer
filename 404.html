<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>클로저스 뷰어 - Closers Viewer</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages SPA 리다이렉트 트릭
      (function () {
        var location = window.location;
        var base = '/';
        // 이미 base 루트라면 무한루프 방지
        var pathname = location.pathname;
        var isRoot = pathname === base || pathname === base.replace(/\/$/, '');
        if (isRoot) return;
        // trailing slash를 제거한 경로를 저장
        var redirect = pathname.replace(/\/([?#]|$)/, '$1') + location.search + location.hash;
        sessionStorage.setItem('spa_redirect', redirect);
        location.replace(base);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
